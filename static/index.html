<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Cloud Transfer Manager — Enterprise Dashboard</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            navy: {
              950: '#070D1B',
              900: '#0B1528',
              850: '#0F1E38',
              800: '#142749',
              700: '#1C3560',
            },
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM & Babel for full JSX in browser -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
      color: #1E293B;
    }
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
    .pulse-glow {
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
    }
    .sidebar-active {
      background: #1E3A8A;
      color: #FFFFFF;
      font-weight: 600;
    }
  </style>
</head>
<body class="antialiased min-h-screen text-slate-800">
  <div id="root"></div>

  <!-- Main Application Script written in React & JSX -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Provider Logos & Badges Helper ---
    function ProviderBadge({ provider, size = "w-5 h-5" }) {
      const p = (provider || "").toLowerCase();
      if (p.includes("google") || p.includes("gdrive")) {
        return (
          <div className="flex items-center gap-1.5">
            <svg className={size} viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg">
              <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
              <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/>
              <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
              <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
              <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
              <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
            </svg>
            <span className="text-xs font-semibold text-slate-700">Google Drive</span>
          </div>
        );
      }
      if (p.includes("onedrive")) {
        return (
          <div className="flex items-center gap-1.5">
            <svg className={size} viewBox="0 0 24 24" fill="none">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#0078D4"/>
            </svg>
            <span className="text-xs font-semibold text-slate-700">OneDrive</span>
          </div>
        );
      }
      if (p.includes("dropbox")) {
        return (
          <div className="flex items-center gap-1.5">
            <svg className={size} viewBox="0 0 24 24" fill="#0061FF">
              <path d="M6 2L0 6.5L6 11L12 6.5L6 2ZM18 2L12 6.5L18 11L24 6.5L18 2ZM0 15.5L6 20L12 15.5L6 11L0 15.5ZM24 15.5L18 11L12 15.5L18 20L24 15.5ZM6 21.5L12 17.5L18 21.5L12 25.5L6 21.5Z"/>
            </svg>
            <span className="text-xs font-semibold text-slate-700">Dropbox</span>
          </div>
        );
      }
      // Local
      return (
        <div className="flex items-center gap-1.5">
          <div className="p-0.5 rounded bg-slate-200 text-slate-700">
            <i data-lucide="hard-drive" className="w-3.5 h-3.5"></i>
          </div>
          <span className="text-xs font-semibold text-slate-700">Local Disk</span>
        </div>
      );
    }

    // --- Status Badge Helper ---
    function StatusBadge({ status }) {
      const s = (status || "").toLowerCase();
      let bg = "bg-blue-50 text-blue-700 border-blue-200";
      let dot = "bg-blue-600";

      if (s === "running") {
        bg = "bg-emerald-50 text-emerald-700 border-emerald-200";
        dot = "bg-emerald-500 animate-ping";
      } else if (s === "completed") {
        bg = "bg-green-50 text-green-700 border-green-200";
        dot = "bg-green-600";
      } else if (s === "paused") {
        bg = "bg-amber-50 text-amber-700 border-amber-200";
        dot = "bg-amber-500";
      } else if (s === "failed") {
        bg = "bg-rose-50 text-rose-700 border-rose-200";
        dot = "bg-rose-500";
      } else if (s === "connected") {
        bg = "bg-emerald-50 text-emerald-700 border-emerald-200";
        dot = "bg-emerald-500";
      } else if (s === "limited access") {
        bg = "bg-orange-50 text-orange-700 border-orange-200";
        dot = "bg-orange-500";
      }

      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border ${bg}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${dot}`}></span>
          {status}
        </span>
      );
    }

    // --- Main Application Component ---
    function App() {
      const [currentNav, setCurrentNav] = useState("dashboard");
      const [summary, setSummary] = useState({
        total_data_gb: 0.0,
        completed_data_gb: 0.0,
        completed_files: 0,
        completed_pct: 0.0,
        failed_data_gb: 0.0,
        failed_files: 0,
        failed_pct: 0.0,
        transfer_speed_mbps: 0.0,
        active_jobs_count: 0
      });
      const [transfers, setTransfers] = useState([]);
      const [accounts, setAccounts] = useState([]);
      const [agent, setAgent] = useState(null);
      const [activity, setActivity] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [user, setUser] = useState(null);

      // Filters & Search
      const [statusFilter, setStatusFilter] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");

      // Wizard Modal State
      const [isWizardOpen, setIsWizardOpen] = useState(false);
      const [wizardStep, setWizardStep] = useState(1);
      const [wizardData, setWizardData] = useState({
        name: "",
        source_account_id: "",
        source_path: "/",
        destination_account_id: "",
        destination_path: "/",
        skip_existing: true,
        rename_conflicts: false,
        replace_existing: false,
        preserve_hierarchy: true,
        verify_integrity: true,
        concurrency: 4
      });

      // App Login Screen State
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [loginTab, setLoginTab] = useState("qr"); // 'qr' or 'credentials'
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [loginQrData, setLoginQrData] = useState(null);
      const [loginError, setLoginError] = useState("");

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const initAppQrLogin = async () => {
        try {
          const res = await fetch('/api/v1/auth/qr/session', { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            setLoginQrData(data);
            
            // Poll for approval
            const interval = setInterval(async () => {
              try {
                const statusRes = await fetch(`/api/v1/auth/qr/status/${data.session_id}`);
                if (statusRes.ok) {
                  const s = await statusRes.json();
                  if (s.status === "authorized") {
                    clearInterval(interval);
                    setUser(s.user);
                    setIsAuthenticated(true);
                    showToast(`Welcome back, ${s.user.name}!`);
                    fetchData();
                  } else if (s.status === "expired") {
                    clearInterval(interval);
                  }
                }
              } catch (e) {}
            }, 2500);
          }
        } catch (e) {}
      };

      const handlePasswordLogin = async (e) => {
        e.preventDefault();
        setLoginError("");
        try {
          const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail, password: loginPassword })
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data.user);
            setIsAuthenticated(true);
            showToast(`Signed in successfully as ${data.user.name}`);
            fetchData();
          } else {
            const err = await res.json();
            setLoginError(err.detail || "Invalid email or password");
          }
        } catch (err) {
          setLoginError("Failed to communicate with authentication server");
        }
      };

      const handleLogout = async () => {
        await fetch('/api/v1/auth/logout', { method: 'POST' });
        setIsAuthenticated(false);
        setUser(null);
        showToast("Logged out securely.");
      };

      const openConnectModal = () => {
        setIsConnectModalOpen(true);
        setDeviceSession(null);
      };

      const startAuthorizationSession = async (provider) => {
        try {
          const res = await fetch(`/api/v1/accounts/${provider}/device-session`, {
            method: 'POST'
          });
          if (res.ok) {
            const data = await res.json();
            setDeviceSession(data);
            
            // Start polling for safe authorization outcome
            if (pollIntervalId) clearInterval(pollIntervalId);
            const interval = setInterval(async () => {
              try {
                const checkRes = await fetch(`/api/v1/accounts/authorization-sessions/${data.session_id}`);
                if (checkRes.ok) {
                  const checkData = await checkRes.json();
                  if (checkData.status === "authorized") {
                    clearInterval(interval);
                    showToast(`${provider} authorized successfully!`);
                    setIsConnectModalOpen(false);
                    setDeviceSession(null);
                    fetchData();
                  } else if (checkData.status === "expired" || checkData.status === "cancelled") {
                    clearInterval(interval);
                    showToast(`Session ${checkData.status}. Please try again.`, "error");
                    setDeviceSession(null);
                  }
                }
              } catch (e) {}
            }, 3000);
            setPollIntervalId(interval);
          }
        } catch (err) {
          showToast("Failed to initiate provider authorization", "error");
        }
      };

      const cancelAuthSession = async () => {
        if (deviceSession?.session_id) {
          await fetch(`/api/v1/accounts/authorization-sessions/${deviceSession.session_id}/cancel`, { method: 'POST' });
        }
        if (pollIntervalId) clearInterval(pollIntervalId);
        setDeviceSession(null);
        setIsConnectModalOpen(false);
      };

      // Fetch Initial Data
      const fetchData = async () => {
        try {
          const [sumRes, transRes, accRes, agRes, actRes, audRes, userRes] = await Promise.all([
            fetch('/api/dashboard/summary').then(r => r.json()),
            fetch('/api/transfers').then(r => r.json()),
            fetch('/api/accounts').then(r => r.json()),
            fetch('/api/agent').then(r => r.json()),
            fetch('/api/activity').then(r => r.json()),
            fetch('/api/audit-logs').then(r => r.json()),
            fetch('/api/user/current').then(r => r.json()),
          ]);

          setSummary(sumRes);
          setTransfers(transRes.items || []);
          setAccounts(accRes.items || []);
          setAgent(agRes);
          setActivity(actRes.items || []);
          setAuditLogs(audRes.items || []);
          setUser(userRes);
        } catch (err) {
          console.warn("Using offline simulated fixtures:", err);
        }
      };

      useEffect(() => {
        // Verify session cookie on mount
        fetch('/api/v1/auth/me')
          .then(r => {
            if (r.ok) return r.json();
            throw new Error("Unauthenticated");
          })
          .then(u => {
            setUser(u);
            setIsAuthenticated(true);
            fetchData();
          })
          .catch(() => {
            setIsAuthenticated(false);
            initAppQrLogin();
          });

        // Setup WebSocket for Live Real-Time Transfer Updates
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/transfers`;
        let ws;
        try {
          ws = new WebSocket(wsUrl);
          ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "PROGRESS_PULSE") {
              setTransfers(data.transfers);
              setSummary(data.summary);
            }
          };
        } catch (e) {
          console.warn("WS connection fallback to polling");
        }

        const interval = setInterval(() => {
          if (isAuthenticated) {
            fetch('/api/dashboard/summary').then(r => r.json()).then(s => setSummary(s)).catch(()=>{});
          }
        }, 5000);

        return () => {
          if (ws) ws.close();
          clearInterval(interval);
        };
      }, [isAuthenticated]);

      // Trigger lucide icons reload whenever DOM renders
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Filtered transfers
      const filteredTransfers = useMemo(() => {
        return transfers.filter(t => {
          const matchStatus = statusFilter === "All" || t.status.toLowerCase() === statusFilter.toLowerCase();
          const q = searchQuery.toLowerCase();
          const matchQuery = !q || 
            t.name.toLowerCase().includes(q) || 
            t.source_provider.toLowerCase().includes(q) || 
            t.destination_provider.toLowerCase().includes(q) ||
            t.id.toLowerCase().includes(q);
          return matchStatus && matchQuery;
        });
      }, [transfers, statusFilter, searchQuery]);

      // Transfer Actions
      const handleAction = async (transferId, action) => {
        try {
          const res = await fetch(`/api/transfers/${transferId}/action`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
          });
          if (res.ok) {
            showToast(`Transfer ${transferId} ${action}d successfully.`);
            fetchData();
          }
        } catch (err) {
          showToast(`Action failed: ${err.message}`, "error");
        }
      };

      // Account Reconnect
      const handleReconnect = async (accId) => {
        try {
          const res = await fetch(`/api/accounts/${accId}/reconnect`, { method: 'POST' });
          if (res.ok) {
            showToast("Account successfully re-authorized via OAuth 2.0 PKCE!");
            fetchData();
          }
        } catch (e) {
          showToast("Failed to reconnect account", "error");
        }
      };

      // New Transfer Submit
      const handleCreateTransfer = async () => {
        if (!wizardData.name.trim()) {
          showToast("Please provide a transfer job name", "error");
          return;
        }
        try {
          const res = await fetch('/api/transfers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(wizardData)
          });
          if (res.ok) {
            const data = await res.json();
            showToast(`Transfer Job ${data.job.id} initialized!`);
            setIsWizardOpen(false);
            setWizardStep(1);
            setWizardData({
              name: "",
              source_account_id: "acc-onedrive-1",
              source_path: "/Finance/2026/Enterprise_Audits",
              destination_account_id: "acc-gdrive-1",
              destination_path: "/CloudArchive/SecureVault",
              skip_existing: true,
              rename_conflicts: false,
              replace_existing: false,
              preserve_hierarchy: true,
              verify_integrity: true,
              concurrency: 6
            });
            fetchData();
          }
        } catch (e) {
          showToast("Error creating transfer job", "error");
        }
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 relative overflow-hidden">
            {/* Background glowing gradients */}
            <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="bg-navy-900 border border-navy-800 w-full max-w-md rounded-2xl shadow-2xl p-8 text-white relative z-10 space-y-6">
              {/* Logo & Header */}
              <div className="text-center space-y-2">
                <div className="w-12 h-12 bg-blue-600 rounded-xl mx-auto flex items-center justify-center text-white shadow-lg">
                  <i data-lucide="cloud-lightning" className="w-7 h-7"></i>
                </div>
                <h1 className="text-xl font-bold tracking-tight">Secure Cloud Transfer Manager</h1>
                <p className="text-xs text-slate-400">Enterprise Large-Volume Migration Suite</p>
              </div>

              {/* Login Modes Switcher */}
              <div className="flex bg-navy-950 p-1 rounded-xl border border-navy-800">
                <button
                  onClick={() => { setLoginTab("qr"); initAppQrLogin(); }}
                  className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-2 ${
                    loginTab === "qr" ? "bg-blue-600 text-white shadow-sm" : "text-slate-400 hover:text-white"
                  }`}
                >
                  <i data-lucide="qr-code" className="w-4 h-4"></i>
                  <span>QR Code Login</span>
                </button>
                <button
                  onClick={() => setLoginTab("credentials")}
                  className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-2 ${
                    loginTab === "credentials" ? "bg-blue-600 text-white shadow-sm" : "text-slate-400 hover:text-white"
                  }`}
                >
                  <i data-lucide="key" className="w-4 h-4"></i>
                  <span>Password</span>
                </button>
              </div>

              {/* QR Code Tab */}
              {loginTab === "qr" && (
                <div className="space-y-4 text-center">
                  <p className="text-xs text-slate-400">
                    Scan with your mobile device or authenticated app for instant passwordless sign in.
                  </p>
                  
                  <div className="p-3 bg-white rounded-2xl inline-block shadow-md">
                    {loginQrData?.qr_code_data_uri ? (
                      <img src={loginQrData.qr_code_data_uri} alt="Login QR Code" className="w-52 h-52 mx-auto" />
                    ) : (
                      <div className="w-52 h-52 flex items-center justify-center text-slate-400">
                        <i data-lucide="loader" className="w-6 h-6 animate-spin"></i>
                      </div>
                    )}
                  </div>

                  <div className="flex items-center justify-center gap-2 text-xs text-slate-400">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Waiting for scan authorization...</span>
                  </div>

                  {/* Instant Mobile Confirmation Simulation Link for User */}
                  <div className="pt-2">
                    <button
                      onClick={async () => {
                        if (loginQrData?.session_id) {
                          await fetch(`/api/v1/auth/qr/authorize-instant?session_id=${loginQrData.session_id}`, { method: 'POST' });
                        }
                      }}
                      className="text-[11px] text-blue-400 hover:text-blue-300 font-medium underline"
                    >
                      Authorize via Verified Mobile Token
                    </button>
                  </div>
                </div>
              )}

              {/* Credentials Tab */}
              {loginTab === "credentials" && (
                <form onSubmit={handlePasswordLogin} className="space-y-4 text-left">
                  {loginError && (
                    <div className="p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">
                      {loginError}
                    </div>
                  )}

                  <div>
                    <label className="text-xs font-semibold text-slate-300 block mb-1.5">Email Address</label>
                    <input
                      type="email"
                      value={loginEmail}
                      onChange={(e) => setLoginEmail(e.target.value)}
                      placeholder="e.g. yourname@domain.com"
                      required
                      className="w-full px-3 py-2 bg-navy-950 border border-navy-800 rounded-lg text-white text-xs focus:ring-1 focus:ring-blue-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-300 block mb-1.5">Account Password</label>
                    <input
                      type="password"
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      placeholder="••••••••••••"
                      required
                      className="w-full px-3 py-2 bg-navy-950 border border-navy-800 rounded-lg text-white text-xs focus:ring-1 focus:ring-blue-500 outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg shadow-sm transition-all"
                  >
                    Sign In to Enterprise Workspace
                  </button>
                </form>
              )}

              {/* Security Policy Reminder */}
              <div className="p-3 rounded-xl bg-navy-950/80 border border-navy-800 text-[11px] text-slate-400 space-y-1">
                <div className="flex items-center gap-1.5 text-emerald-400 font-semibold">
                  <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                  <span>Zero-Knowledge Principle</span>
                </div>
                <p>
                  Application login never grants cloud account access. Credentials and passwords are never collected.
                </p>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex min-h-screen">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 bg-white border border-slate-200 rounded-lg shadow-xl animate-bounce">
              <div className={`p-1 rounded-full ${toast.type === 'error' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>
                <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check'} className="w-5 h-5"></i>
              </div>

                      </div>

                      <div>
                        <label className="font-bold text-slate-800 block mb-1">Select Source Provider</label>
                        <div className="grid grid-cols-2 gap-3">
                          {accounts.map(acc => (
                            <div
                              key={acc.id}
                              onClick={() => setWizardData({ ...wizardData, source_account_id: acc.id })}
                              className={`p-3 rounded-lg border cursor-pointer transition-all ${
                                wizardData.source_account_id === acc.id
                                  ? "border-blue-600 bg-blue-50/50 ring-1 ring-blue-600"
                                  : "border-slate-200 hover:border-slate-300"
                              }`}
                            >
                              <div className="flex items-center gap-2">
                                <ProviderBadge provider={acc.provider} size="w-5 h-5" />
                              </div>
                              <div className="font-semibold text-slate-800 mt-2">{acc.name}</div>
                              <div className="text-[10px] text-slate-400 truncate">{acc.masked_id}</div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="font-bold text-slate-800 block mb-1">Source Path / Directory</label>
                        <input
                          type="text"
                          value={wizardData.source_path}
                          onChange={(e) => setWizardData({ ...wizardData, source_path: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg font-mono text-xs text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none"
                        />
                      </div>
                    </div>
                  )}

                  {wizardStep === 2 && (
                    <div className="space-y-4">
                      <div>
                        <label className="font-bold text-slate-800 block mb-1">Select Destination Provider</label>
                        <div className="grid grid-cols-2 gap-3">
                          {accounts.map(acc => (
                            <div
                              key={acc.id}
                              onClick={() => setWizardData({ ...wizardData, destination_account_id: acc.id })}
                              className={`p-3 rounded-lg border cursor-pointer transition-all ${
                                wizardData.destination_account_id === acc.id
                                  ? "border-blue-600 bg-blue-50/50 ring-1 ring-blue-600"
                                  : "border-slate-200 hover:border-slate-300"
                              }`}
                            >
                              <div className="flex items-center gap-2">
                                <ProviderBadge provider={acc.provider} size="w-5 h-5" />
                              </div>
                              <div className="font-semibold text-slate-800 mt-2">{acc.name}</div>
                              <div className="text-[10px] text-slate-400 truncate">{acc.masked_id}</div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="font-bold text-slate-800 block mb-1">Destination Target Path</label>
                        <input
                          type="text"
                          value={wizardData.destination_path}
                          onChange={(e) => setWizardData({ ...wizardData, destination_path: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg font-mono text-xs text-slate-800 focus:ring-1 focus:ring-blue-500 outline-none"
                        />
                      </div>
                    </div>
                  )}

                  {wizardStep === 3 && (
                    <div className="space-y-4">
                      <div className="p-3 bg-blue-50 border border-blue-100 rounded-lg text-blue-800">
                        <i data-lucide="shield-alert" className="w-4 h-4 inline mr-1 text-blue-600"></i>
                        Source files will remain unchanged. Transfers never delete remote records automatically.
                      </div>

                      <div className="space-y-3">
                        <label className="flex items-center gap-2.5 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={wizardData.skip_existing}
                            onChange={(e) => setWizardData({ ...wizardData, skip_existing: e.target.checked })}
                            className="rounded text-blue-600"
                          />
                          <div>
                            <span className="font-bold text-slate-800">Skip Existing Files</span>
                            <p className="text-[11px] text-slate-400">Do not re-transfer files that have matching hash and timestamp.</p>
                          </div>
                        </label>

                        <label className="flex items-center gap-2.5 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={wizardData.verify_integrity}
                            onChange={(e) => setWizardData({ ...wizardData, verify_integrity: e.target.checked })}
                            className="rounded text-blue-600"
                          />
                          <div>
                            <span className="font-bold text-slate-800">Verify File Integrity (SHA-256)</span>
                            <p className="text-[11px] text-slate-400">Compute cryptographic verification before declaring job complete.</p>
                          </div>
                        </label>

                        <label className="flex items-center gap-2.5 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={wizardData.preserve_hierarchy}
                            onChange={(e) => setWizardData({ ...wizardData, preserve_hierarchy: e.target.checked })}
                            className="rounded text-blue-600"
                          />
                          <div>
                            <span className="font-bold text-slate-800">Preserve Subfolder Directory Structure</span>
                            <p className="text-[11px] text-slate-400">Replicate directory nesting exactly as on source.</p>
                          </div>
                        </label>
                      </div>

                      <div>
                        <label className="font-bold text-slate-800 block mb-1">Concurrency Threads</label>
                        <select
                          value={wizardData.concurrency}
                          onChange={(e) => setWizardData({ ...wizardData, concurrency: parseInt(e.target.value) })}
                          className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                        >
                          <option value="2">2 Parallel Worker Threads</option>
                          <option value="4">4 Parallel Worker Threads (Recommended)</option>
                          <option value="8">8 Parallel Worker Threads (High Throughput)</option>
                        </select>
                      </div>
                    </div>
                  )}

                  {wizardStep === 4 && (
                    <div className="space-y-4">
                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                        <div className="flex justify-between border-b border-slate-200/60 pb-2">
                          <span className="text-slate-500">Pipeline Name:</span>
                          <span className="font-bold text-slate-800">{wizardData.name || "Untitled Transfer"}</span>
                        </div>
                        <div className="flex justify-between border-b border-slate-200/60 pb-2">
                          <span className="text-slate-500">Source:</span>
                          <span className="font-mono text-slate-800">{wizardData.source_path}</span>
                        </div>
                        <div className="flex justify-between border-b border-slate-200/60 pb-2">
                          <span className="text-slate-500">Destination:</span>
                          <span className="font-mono text-slate-800">{wizardData.destination_path}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Integrity Check:</span>
                          <span className="text-emerald-600 font-bold">SHA-256 Enabled</span>
                        </div>
                      </div>

                      <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-800 text-xs">
                        <strong>Ready to initiate:</strong> Backend job will be provisioned with safe dry-run conflict detection.
                      </div>
                    </div>
                  )}
                </div>

                {/* Wizard Footer Controls */}
                <div className="px-6 py-4 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between">
                  {wizardStep > 1 ? (
                    <button
                      onClick={() => setWizardStep(wizardStep - 1)}
                      className="px-4 py-2 border border-slate-200 text-slate-700 font-semibold text-xs rounded-lg hover:bg-slate-100"
                    >
                      Back
                    </button>
                  ) : <div></div>}

                  {wizardStep < 4 ? (
                    <button
                      onClick={() => {
                        if (wizardStep === 1 && !wizardData.name.trim()) {
                          showToast("Please enter a transfer name", "error");
                          return;
                        }
                        setWizardStep(wizardStep + 1);
                      }}
                      className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg shadow-sm"
                    >
                      Next Step →
                    </button>
                  ) : (
                    <button
                      onClick={handleCreateTransfer}
                      className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-lg shadow-sm"
                    >
                      Confirm & Start Transfer
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* CONNECT PROVIDER & QR-CODE AUTHORIZATION MODAL */}
          {isConnectModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
                {/* Header */}
                <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center">
                      <i data-lucide="qr-code" className="w-4 h-4"></i>
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-slate-900">Connect Cloud Account</h3>
                      <p className="text-xs text-slate-500">Official OAuth 2.0 PKCE & Secure QR Device Authorization</p>
                    </div>
                  </div>
                  <button 
                    onClick={cancelAuthSession}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                {/* Content */}
                <div className="p-6 space-y-4 text-xs">
                  {!deviceSession ? (
                    <div>
                      <label className="font-bold text-slate-800 block mb-2">Select Provider to Authorize</label>
                      <div className="grid grid-cols-2 gap-3 mb-4">
                        {[
                          { id: "google-drive", name: "Google Drive", desc: "OAuth 2.0 Browser + Mobile QR" },
                          { id: "onedrive", name: "OneDrive", desc: "Microsoft Device Code + QR" },
                          { id: "dropbox", name: "Dropbox", desc: "OAuth 2.0 PKCE + Mobile QR" },
                          { id: "local", name: "Local Agent", desc: "Windows mTLS Enrollment" }
                        ].map(p => (
                          <div
                            key={p.id}
                            onClick={() => setSelectedProvider(p.id)}
                            className={`p-3 rounded-lg border cursor-pointer transition-all ${
                              selectedProvider === p.id
                                ? "border-blue-600 bg-blue-50/50 ring-1 ring-blue-600"
                                : "border-slate-200 hover:border-slate-300"
                            }`}
                          >
                            <ProviderBadge provider={p.id} size="w-5 h-5" />
                            <div className="font-bold text-slate-800 mt-2">{p.name}</div>
                            <div className="text-[10px] text-slate-400">{p.desc}</div>
                          </div>
                        ))}
                      </div>

                      <div className="p-3 bg-amber-50 border border-amber-200 rounded-lg text-amber-900 text-[11px] mb-4">
                        <i data-lucide="shield" className="w-3.5 h-3.5 inline mr-1 text-amber-600"></i>
                        Application login never grants cloud account access. Credentials and passwords are never collected.
                      </div>

                      <button
                        onClick={() => startAuthorizationSession(selectedProvider)}
                        className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg shadow-sm"
                      >
                        Generate Secure Authorization Session
                      </button>
                    </div>
                  ) : (
                    <div className="text-center space-y-4">
                      {deviceSession.qr_code_data_uri ? (
                        <div className="space-y-2">
                          <div className="inline-block p-2 bg-white rounded-xl border border-slate-200 shadow-sm">
                            <img src={deviceSession.qr_code_data_uri} alt="Authorization QR Code" className="w-48 h-48 mx-auto" />
                          </div>
                          <div className="text-[11px] font-semibold text-slate-700">Scan with phone camera or QR reader</div>
                        </div>
                      ) : null}

                      {deviceSession.user_code && (
                        <div className="p-3 bg-slate-50 border border-slate-200 rounded-lg">
                          <span className="text-slate-500 text-[10px] uppercase font-bold block">Device Authorization Code</span>
                          <span className="text-xl font-mono font-bold tracking-widest text-blue-600">{deviceSession.user_code}</span>
                        </div>
                      )}

                      <div className="flex items-center justify-center gap-2 text-slate-500 text-xs">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                        <span>Waiting for authorization on provider site...</span>
                      </div>

                      <div className="pt-2 flex gap-3">
                        <a
                          href={deviceSession.verification_url}
                          target="_blank"
                          rel="noreferrer"
                          className="flex-1 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold rounded-lg text-center"
                        >
                          Open in Browser ↗
                        </a>
                        <button
                          onClick={cancelAuthSession}
                          className="px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold rounded-lg"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
